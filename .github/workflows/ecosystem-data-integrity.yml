name: SSAG Ecosystem Data Integrity Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Read-only cross-division audit
        env:
          SSAG_SENTINEL_DATABASE_URL: ${{ secrets.SSAG_SENTINEL_DATABASE_URL }}
          SSAG_DISPATCH_DATABASE_URL: ${{ secrets.SSAG_DISPATCH_DATABASE_URL }}
          SSAG_CLIENTFLOW_DATABASE_URL: ${{ secrets.SSAG_CLIENTFLOW_DATABASE_URL }}
          SSAG_TURNSLATE_DATABASE_URL: ${{ secrets.SSAG_TURNSLATE_DATABASE_URL }}
          SSAG_NEXTCHAPTER_DATABASE_URL: ${{ secrets.SSAG_NEXTCHAPTER_DATABASE_URL }}
        run: python ecosystem-audit/audit.py
      - name: Preserve redacted audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssag-gap-audit
          path: ssag-gap-audit.json
          if-no-files-found: warn
