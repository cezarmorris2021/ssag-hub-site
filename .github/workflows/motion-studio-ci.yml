name: Motion Studio API quality gate
on:
  push:
    paths:
      - 'motion-studio/**'
      - '.github/workflows/motion-studio-ci.yml'
  pull_request:
    paths:
      - 'motion-studio/**'
      - '.github/workflows/motion-studio-ci.yml'
permissions:
  contents: read
jobs:
  cpu-api-tests:
    name: Security and GPU-truth tests (not an actual video render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API-only requirements
        run: python -m pip install -r motion-studio/worker/requirements.txt
      - name: Compile syntax
        run: python -m py_compile motion-studio/worker/server.py motion-studio/worker/tests/test_api.py
      - name: Run auth, GPU-gate and deletion tests
        working-directory: motion-studio/worker
        run: python -m unittest discover -s tests -v
      - name: Validate free-GPU notebook structure and Python code without running GPU
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('motion-studio/free-gpu-notebook.ipynb')
          nb=json.loads(p.read_text(encoding='utf-8'))
          assert nb['nbformat']==4
          code=[ ''.join(cell['source']) for cell in nb['cells'] if cell['cell_type']=='code']
          assert len(code)>=5
          for i,source in enumerate(code):
              compile(source, str(p)+':cell:'+str(i), 'exec')
          assert all('--backend","mock' not in source for source in code)
          print("Notebook JSON and",len(code),"Python cells parsed; no GPU render was attempted.")
          PY

