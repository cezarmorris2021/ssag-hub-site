name: SSAG YouTube operations safety tests
on:
  push:
    paths:
      - 'youtube-operations/**'
      - '.github/workflows/youtube-operations-ci.yml'
  pull_request:
    paths:
      - 'youtube-operations/**'
      - '.github/workflows/youtube-operations-ci.yml'
permissions:
  contents: read
jobs:
  publisher-tests:
    name: Publishing safety rules (no YouTube account access)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile youtube-operations/publisher/publish.py youtube-operations/publisher/tests/test_publish.py
      - name: Test manifest validation and safe publication controls
        working-directory: youtube-operations/publisher
        run: python -m unittest discover -s tests -v
      - name: Parse web application JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('youtube-operations/index.html','utf8');
          const script=html.split('<script>')[1]?.split('</script>')[0];
          if(!script) throw new Error('App script missing');
          new Function(script);
          if(!html.includes('exportReport')||!html.includes('downloadPack'))throw new Error('Missing production controls');
          console.log('YouTube UI JavaScript parsed successfully');
          JS
      - name: Install browser QA dependency
        run: |
          npm --prefix youtube-operations install --no-save playwright@1.57.0
          npx --prefix youtube-operations playwright install --with-deps chromium
      - name: Browser-test owner production and support workflow
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory youtube-operations >/tmp/ssag-youtube-test-server.log 2>&1 &
          sleep 2
          node youtube-operations/tests/browser-qa.js
      - name: Render a REAL short video on CPU and verify MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r youtube-operations/renderer/requirements.txt
          command -v ffmpeg
          command -v ffprobe
          python -m py_compile youtube-operations/renderer/render.py youtube-operations/renderer/tests/test_renderer.py
          python -m unittest discover -s youtube-operations/renderer/tests -v


